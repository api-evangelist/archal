  /api/environments/{environmentId}/state/validate:
    post:
      operationId: validateEnvironmentState
      summary: Validate state without starting an environment
      security:
      - bearerAuth: []
      parameters:
      - name: environmentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/sql:
            schema:
              type: string
              minLength: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    const: archal.environment-state-validation
                  version:
                    type: number
                    const: 1
                  environmentId:
                    type: string
                    minLength: 1
                    maxLength: 80
                  format:
                    type: string
                    enum:
                    - json
                    - sql
                  valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                          minLength: 1
                        code:
                          type: string
                          minLength: 1
                      required:
                      - path
                      - message
                      additionalProperties: {}
                  contract:
                    anyOf:
                    - type: object
                      properties:
                        schema:
                          type: string
                          minLength: 1
                        version:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                      required:
                      - schema
                      - version
                      additionalProperties: false
