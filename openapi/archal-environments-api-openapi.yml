                            - rest
                            - mcp
                        certification:
                          type: object
                          properties:
                            status:
                              type: string
                              enum:
                              - healthy
                              - degraded
                              - quarantined
                              - unknown
                            admission:
                              type: string
                              enum:
                              - allow
                              - warn
                              - deny
                            checkedAt:
                              anyOf:
                              - type: string
                                format: date-time
                                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                              - type: 'null'
                            evidenceSha256:
                              anyOf:
                              - type: string
                                pattern: ^[a-f0-9]{64}$
                              - type: 'null'
                          required:
                          - status
                          - admission
                          - checkedAt
                          - evidenceSha256
                          additionalProperties: false
                        state:
                          type: object
                          properties:
                            readable:
                              type: boolean
                            writable:
                              type: boolean
                            resettable:
                              type: boolean
                            formats:
                              type: array
                              items:
                                type: string
                                enum:
                                - json
                                - sql
                            contract:
                              anyOf:
                              - type: object
                                propertyNames:
                                  type: string
                                additionalProperties: {}
                              - type: 'null'
                          required:
                          - readable
                          - writable
                          - resettable
                          - formats
                          - contract
                          additionalProperties: false
                      required:
                      - id
                      - name
                      - availability
