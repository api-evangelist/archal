openapi: 3.2.0
info:
  title: Archal Environments API
  version: 1.0.0
  summary: Stateful testing environments with separate lifecycle and provider-scoped credentials
  description: Use a workspace credential for lifecycle operations. Each created environment returns a short-lived provider-shaped credential for its isolated data plane; the workspace credential is never forwarded to or accepted by provider-compatible endpoints.
servers:
- url: https://api.archal.ai
tags:
- name: Environments
paths:
  /api/environments:
    get:
      operationId: listEnvironments
      summary: List environment capabilities and state contracts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    const: archal.environment-catalog
                  version:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  environments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 80
                        name:
                          type: string
                          minLength: 1
                        availability:
                          type: string
                          enum:
                          - available
                          - in-progress
                        startable:
                          type: boolean
                        launch:
                          type: boolean
                        transports:
                          type: array
                          items:
                            type: string
