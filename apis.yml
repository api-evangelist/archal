aid: archal
name: Archal
description: >-
  Archal is a Y Combinator (S26) company building QA and an improvement loop for AI agents.
  It provisions hosted, service-shaped CLONES of real SaaS services — GitHub, Slack, Stripe,
  Jira, Linear, Supabase, Ramp, HubSpot, Datadog, Discord, Google Workspace and more — so an
  agent that can send emails, change code repositories, or call third-party APIs is tested and
  scored before it touches production. Clones hold state, enforce referential integrity, and
  return authentic error shapes, unlike traditional mocks. Its Autoloop turns real production
  agent traces into reproducible failures and can open a fix PR. Archal ships an npm CLI and
  Vitest SDK, a device-auth login, a runtime clone proxy, and per-session MCP endpoints.
