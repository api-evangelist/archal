seeds:
  docs: https://docs.archal.ai/guides/seeds
  kinds: [built-in, file-backed, replayed]
  detail: A seed sets the starting state of a clone before a run.
telemetry:
  default: off
  enable: 'archal config set telemetry true  (or ARCHAL_TELEMETRY=1)'
